name: CI

# 触发时机：推 main、提 PR、以及手动点一次。
# 为什么要在"推 main"上也跑：本地跑绿只证明"在我的机器上绿"。
# 真实的第一次失败就是这样来的——本地 105 passed，把 .env 藏起来再跑就 1 failed。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支连续推送时，取消上一次还在跑的构建：不浪费时间，也避免两条流水线
# 同时抢同一份覆盖率结果。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：这个工作流只需要读代码。
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- 质量门
  quality-gate:
    name: 质量门 · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      # 一个版本挂了也让另一个版本跑完——否则看不出是"所有版本都挂"还是"只有某个版本挂"
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: 安装 uv（并准备对应版本的 Python）
        # 钉到【完整版本号】而不是 v10：这个 action 没有浮动 major tag。
        # 实测三个 ref 的存在性（gh api repos/astral-sh/setup-uv/git/ref/tags/<ref>）：
        #   v5       → refs/tags/v5        ✅ 存在（所以最初 @v5 能跑）
        #   v9       → 404                 ❌
        #   v10      → 404                 ❌   ← 写 @v10 直接报 unable to find version
        #   v10.3.0  → refs/tags/v10.3.0   ✅
        # 也就是说它在 v9 之后不再发布浮动 major tag 了。
        # 顺带一提，钉完整版本本来就比钉 major 更该做：浮动 tag 会在你不知情时变，
        # 跟"依赖不锁版本"是同一类问题。代价是要手动升（可交给 Dependabot）。
        uses: astral-sh/setup-uv@v10.3.0
        with:
          # 锁到与开发机相同的版本：uv 的解析行为会随版本变化，
          # CI 与本地用不同版本，"本地能装、CI 装不上"这类问题就无从排查
          version: "0.12.10"
          # ⚠️ 必须显式传 python-version，matrix 才会真正生效。
          # 第一次跑的时候漏了这行：两个 job 都去下载 cpython-3.13.15，
          # 矩阵成了摆设——"看起来测了两个版本"，实际只测了一个。
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: 按 uv.lock 安装依赖
        # --locked = 锁文件与 pyproject 不一致就直接失败，不许偷偷改锁文件。
        #           （默认行为是自动更新锁文件，那 CI 就失去"复现"的意义了）
        #
        # 这里【不能】用 --default-index 覆盖 pyproject 里的清华镜像。原因是
        # uv.lock 把每个包的 source 与真实下载 URL 都钉死在镜像地址上（680 行），
        # 换默认源会让 uv 判定"锁文件需要更新"，--locked 直接失败。本地实测：
        #   uv sync --locked                                        → 退出码 0
        #   uv sync --locked --default-index https://pypi.org/simple → 退出码 1
        #     error: The lockfile at `uv.lock` needs to be updated
        # 所以这两个参数是互斥的：要么换源并重新 uv lock，要么沿用锁里的源。
        run: uv sync --locked

      - name: 类型检查（src/ 与 tests/）
        run: uv run mypy src/ tests/

      - name: 类型检查（scripts/）
        # scripts 单跑需要 MYPYPATH 才能解析 src 布局；src/tests 由 mypy 配置覆盖
        run: uv run mypy scripts/
        env:
          MYPYPATH: src

      - name: 测试 + 覆盖率
        # --cov-fail-under=100：README 写着"覆盖率 100%"，那就让 CI 来守这条线。
        # 少了这个参数，覆盖率是"某次跑过的观测值"；有了它，才是"不可回退的约束"。
        run: uv run pytest -q --cov=ai_lab --cov-report=term-missing --cov-fail-under=100

  # ------------------------------------------------- 端到端（真实协议栈）
  # 这个 job 存在的唯一理由，是 pytest 那一层证不了协议行为：
  #   TestClient 把 ASGI 事件直接喂给应用，跳过了端口绑定、真实请求头、
  #   协议升级握手、帧编解码。实测差异：握手被拒时 TestClient 抛
  #   WebSocketDisconnect，真实客户端拿到的是 HTTP 403；SSE 的时序在
  #   TestClient 里全是 0.000s。这些结论必须由真实客户端来守。
  e2e:
    name: 端到端 · 真实 HTTP / WebSocket
    runs-on: ubuntu-latest

    env:
      # 故意用【明确的假值】，而不是配一个 secret。
      # 测试和脚本本来就该自己造配置；一旦它们偷偷依赖真实密钥，
      # 我们就会在"CI 恰好配了 secret"的情况下侥幸变绿。
      CLIENT_API_KEY: ci-client-key
      LLM_API_KEY: sk-ci-upstream-key

    steps:
      - uses: actions/checkout@v7

      - name: 安装 uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.10"
          python-version: "3.13"
          enable-cache: true

      - name: 按 uv.lock 安装依赖
        run: uv sync --locked

      - name: 起服务 → 打真实 HTTP/WS → 校验错误契约与日志格式 → 收尾
        # 启服务和跑脚本放在同一个 step 里：GitHub Actions 的每个 step 是独立 shell，
        # 上一步用 & 起的后台进程不保证活到下一步。
        run: |
          # ---------------------------------------------------------------- 起服务
          # 两条流【分开】重定向，这是 check_json_logs.py 能工作的前提：
          #   stdout → 我们的 JsonFormatter 输出（JSON）
          #   stderr → uvicorn 自己的 default handler（纯文本 + traceback）
          # 合并成一个文件的话，uvicorn 的 traceback 会让"每行必须是 JSON"直接不成立，
          # 于是校验脚本被迫放宽标准——那它就不再能守住我们真正关心的东西了。
          #
          # --no-access-log 关掉 uvicorn 内置的访问日志。它自己也写 stdout 且是纯文本，
          # 实测不关的话 stdout 里一半的行是不可解析的：
          #     INFO:     127.0.0.1:60859 - "GET /health HTTP/1.1" 200 OK
          # 而我们的访问日志信息量严格更大（带 request_id 与 duration_ms），
          # 留着它等于同一件事付两次钱，还逼着采集端容忍两种格式。
          uv run uvicorn ai_lab.api:app --host 127.0.0.1 --port 8000 \
            --no-access-log > /tmp/app.jsonl 2> /tmp/uvicorn.err &
          SERVER_PID=$!

          ready=0
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8000/health; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "::error::服务未在 30 秒内就绪"
            echo "--- 我们的日志 (stdout) ---"; cat /tmp/app.jsonl || true
            echo "--- uvicorn 日志 (stderr) ---"; cat /tmp/uvicorn.err || true
            exit 1
          fi
          echo "服务已就绪 (pid=$SERVER_PID)"

          # -------------------------------------------------- 三个脚本都必须跑完
          # 各自返回退出码，这里都跑完再汇总——
          # 前一个失败就中断，会让人以为后一个也是同样的原因。
          smoke=0
          ws=0
          contract=0
          uv run python scripts/smoke_api.py || smoke=$?
          uv run python scripts/ws_client_demo.py || ws=$?
          uv run python scripts/probe_error_contract.py || contract=$?

          kill "$SERVER_PID" 2>/dev/null || true

          # ------------------------------------------------- 日志格式（独立一项）
          # 这一项守的是"测试永远测不到"的东西：应用有没有真的把 JsonFormatter 装上。
          # 它曾经是没装的（setup_logging 只在 __main__ 和测试里被调用），
          # 后果是中间件的 INFO 访问日志被 logging.lastResort 整条丢掉——
          # 而所有 pytest 用例当时全绿。只有读真实服务写出的文件才能发现。
          logs=0
          uv run python scripts/check_json_logs.py /tmp/app.jsonl || logs=$?

          if [ "$smoke" != "0" ] || [ "$ws" != "0" ] || [ "$contract" != "0" ] || [ "$logs" != "0" ]; then
            echo "::error::端到端失败：smoke=$smoke ws=$ws contract=$contract logs=$logs"
            echo "--- 我们的日志 (stdout，末尾 40 行) ---"
            tail -40 /tmp/app.jsonl || true
            echo "--- uvicorn 日志 (stderr，末尾 40 行) ---"
            tail -40 /tmp/uvicorn.err || true
            exit 1
          fi
          echo "端到端全部通过"
